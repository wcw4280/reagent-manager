name: Keep App and Supabase Alive

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sS -f \
            "${{ secrets.SUPABASE_URL }}/rest/v1/reagents?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"

      - name: Ping Streamlit App
        run: |
          curl -sS --max-time 60 \
            -o /dev/null \
            -w "Streamlit HTTP status: %{http_code}\n" \
            "https://reagent-manager-c8gyrc9nyim7bkcnpip9jr.streamlit.app/" || true
